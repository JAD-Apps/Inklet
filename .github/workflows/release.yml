name: Release

# Publishes a portable, self-contained Windows build when a version tag is
# pushed. Builds are unpackaged (no MSIX) and unsigned — SmartScreen will warn
# on first run until code-signing certificates are in place.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: publish win-${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      # 'dotnet publish' does not apply -p:Platform on this project shape, which
      # silently skips WinUI PRI/XBF resource generation and ships an exe that
      # dies at startup with 0xC000027B. Driving Publish through msbuild applies
      # the platform correctly; the csproj's PublishWinUIAppResources target then
      # carries the app's own .pri/.xbf into the output.
      - name: Publish
        run: >
          dotnet msbuild "Inklet/Inklet.csproj"
          -t:Publish
          -restore
          -p:Configuration=Release
          -p:Platform=${{ matrix.arch }}
          -p:RuntimeIdentifier=win-${{ matrix.arch }}
          -p:SelfContained=true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true

      - name: Verify publish output
        shell: pwsh
        run: |
          $publish = "Inklet/bin/${{ matrix.arch }}/Release/net8.0-windows10.0.19041.0/win-${{ matrix.arch }}/publish"
          if (-not (Test-Path "$publish/Inklet.exe")) { throw "missing Inklet.exe in $publish" }
          # The resource index and compiled XAML are what the 1.0.9 release shipped
          # without; their absence means a build that cannot start.
          foreach ($required in 'Inklet.pri', 'Microsoft.UI.pri', 'App.xbf', 'MainWindow.xbf') {
            if (-not (Test-Path "$publish/$required")) { throw "missing $required - the build would crash at startup" }
          }

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $publish = "Inklet/bin/${{ matrix.arch }}/Release/net8.0-windows10.0.19041.0/win-${{ matrix.arch }}/publish"
          Compress-Archive -Path "$publish/*" -DestinationPath "Inklet-$tag-win-${{ matrix.arch }}.zip"

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Inklet-win-${{ matrix.arch }}
          path: '*.zip'

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download builds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '
            /^## \[Unreleased\]/ { inrel=0; next }
            /^## \[/ { if (inrel) exit; inrel=1; print; next }
            inrel { print }
          ' CHANGELOG.md)
          {
            echo "$notes"
            echo
            echo "### Download"
            echo
            echo "Portable, self-contained build — unzip and run \`Inklet.exe\`. No installer, no .NET runtime needed."
            echo
            echo "> Builds are unsigned; Windows SmartScreen will warn on first run. Choose **More info** -> **Run anyway** if you trust the source."
          } > notes.md
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "Inklet ${{ github.ref_name }}" \
            --notes-file notes.md
